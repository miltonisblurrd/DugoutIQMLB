name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: .NET build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build DugoutIQ.slnx
      - name: Test
        run: dotnet test DugoutIQ.slnx --no-build

  frontend:
    name: Next.js lint, types, and build
    needs: backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_DUGOUTIQ_API_URL: http://localhost:5080
