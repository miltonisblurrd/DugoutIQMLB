name: API image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/api-image.yml
      - src/**
      - DugoutIQ.slnx

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish API image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/miltonisblurrd/dugoutiq-api:latest
          provenance: false
      - name: Confirm the image can be pulled without credentials
        run: |
          curl -fsSI \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            https://ghcr.io/v2/miltonisblurrd/dugoutiq-api/manifests/latest
